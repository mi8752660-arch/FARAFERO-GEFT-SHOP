<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FARAFERO GIFT SHOP - متجر الهدايا ونظام الكاشير</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Cairo Font for Premium Arabic Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Cairo', 'sans-serif'],
                    },
                    colors: {
                        blush: { 50: '#fdf2f4', 100: '#fbe7eb', 500: '#e07a93', 600: '#cf5d78', 700: '#b0455f' },
                        rosegold: { 500: '#b76e79', 600: '#9e5863' }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cf5d78; border-radius: 4px; }
        @media print {
            body * { visibility: hidden; }
            #printable-receipt, #printable-receipt * { visibility: visible; }
            #printable-receipt { position: absolute; right: 0; top: 0; width: 100%; direction: rtl; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

    <!-- TOP HEADER -->
    <header class="bg-white/90 backdrop-blur-md sticky top-0 z-40 border-b border-blush-100 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <!-- Brand Logo -->
            <div class="flex items-center space-x-3 space-x-reverse cursor-pointer" onclick="switchTab('store')">
                <div class="w-12 h-12 bg-gradient-to-tr from-blush-500 to-rosegold-500 rounded-2xl flex items-center justify-center text-white shadow-md">
                    <i class="fa-solid fa-gift text-xl"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-black tracking-wide text-slate-900">فرافيرو <span class="text-blush-600 font-normal">جيفت شوب</span></h1>
                    <p class="text-xs text-slate-500 font-semibold">عالم الهدايا والتغليف الفاخر</p>
                </div>
            </div>

            <!-- Navigation Tabs -->
            <nav class="hidden md:flex items-center space-x-1 space-x-reverse bg-blush-50/70 p-1.5 rounded-2xl border border-blush-100">
                <button onclick="switchTab('store')" id="nav-store" class="px-5 py-2.5 rounded-xl font-bold text-sm transition-all bg-white text-blush-600 shadow-sm">
                    <i class="fa-solid fa-store ml-2"></i> الواجهة والواجهة الرئيسية
                </button>
                <button onclick="switchTab('pos')" id="nav-pos" class="px-5 py-2.5 rounded-xl font-bold text-sm transition-all text-slate-600 hover:text-blush-600">
                    <i class="fa-solid fa-cash-register ml-2"></i> نقطة البيع (الكاشير)
                </button>
                <button onclick="switchTab('admin')" id="nav-admin" class="px-5 py-2.5 rounded-xl font-bold text-sm transition-all text-slate-600 hover:text-blush-600">
                    <i class="fa-solid fa-chart-line ml-2"></i> لوحة التحكم والطلبات
                </button>
            </nav>

            <!-- Cart Button -->
            <div class="flex items-center space-x-3 space-x-reverse">
                <button onclick="openCart()" class="relative bg-blush-50 hover:bg-blush-100 text-blush-700 px-4 py-2.5 rounded-2xl font-bold transition-all flex items-center space-x-2 space-x-reverse border border-blush-200">
                    <i class="fa-solid fa-bag-shopping text-lg"></i>
                    <span class="hidden sm:inline">سلة المشتريات</span>
                    <span id="cart-badge" class="bg-blush-600 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center font-bold">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- MOBILE NAVIGATION BAR -->
    <div class="md:hidden bg-white border-b border-blush-100 px-4 py-2 flex justify-around shadow-sm sticky top-20 z-30">
        <button onclick="switchTab('store')" id="mob-nav-store" class="text-xs font-bold text-blush-600 flex flex-col items-center">
            <i class="fa-solid fa-store text-lg mb-1"></i> المتجر
        </button>
        <button onclick="switchTab('pos')" id="mob-nav-pos" class="text-xs font-bold text-slate-500 flex flex-col items-center">
            <i class="fa-solid fa-cash-register text-lg mb-1"></i> الكاشير
        </button>
        <button onclick="switchTab('admin')" id="mob-nav-admin" class="text-xs font-bold text-slate-500 flex flex-col items-center">
            <i class="fa-solid fa-chart-line text-lg mb-1"></i> لوحة التحكم
        </button>
    </div>

    <!-- MAIN APP CONTAINER -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">

        <!-- ==================== TAB 1: STOREFRONT & CUSTOMIZER ==================== -->
        <div id="tab-store" class="space-y-12">
            <!-- Hero Banner & Customizer Section -->
            <section class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
                <div class="lg:col-span-5 space-y-6">
                    <div class="inline-flex items-center space-x-2 space-x-reverse bg-blush-100 text-blush-700 px-4 py-1.5 rounded-full text-xs font-bold">
                        <i class="fa-solid fa-wand-magic-sparkles"></i> <span>تغليف مخصص وتوصيل سريع</span>
                    </div>
                    <h2 class="text-4xl sm:text-5xl font-black text-slate-900 leading-tight">
                        صنّع أجمل الذكريات مغلفة بـ <span class="text-blush-600">إتقان</span> ✨
                    </h2>
                    <p class="text-slate-600 text-base leading-relaxed font-medium">
                        اختر هديتك المف
