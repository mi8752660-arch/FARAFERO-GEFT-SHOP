<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FARAFERO GIFT SHOP - متجر الهدايا ونظام الكاشير</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Cairo', 'sans-serif'] },
                    colors: {
                        blush: { 50: '#fdf2f4', 100: '#fbe7eb', 500: '#e07a93', 600: '#cf5d78', 700: '#b0455f' },
                        rosegold: { 500: '#b76e79', 600: '#9e5863' }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cf5d78; border-radius: 4px; }
        @media print {
            body * { visibility: hidden; }
            #printable-receipt, #printable-receipt * { visibility: visible; }
            #printable-receipt { position: absolute; right: 0; top: 0; width: 100%; direction: rtl; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col pb-20 md:pb-0">

    <!-- TOP HEADER -->
    <header class="bg-white/90 backdrop-blur-md sticky top-0 z-40 border-b border-blush-100 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <!-- Brand Logo & Realtime Sync Tag -->
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="flex items-center space-x-2 space-x-reverse cursor-pointer" onclick="switchTab('store')">
                    <div class="w-10 h-10 bg-gradient-to-tr from-blush-500 to-rosegold-500 rounded-2xl flex items-center justify-center text-white shadow-md">
                        <i class="fa-solid fa-gift text-base"></i>
                    </div>
                    <div>
                        <h1 class="text-lg font-black tracking-wide text-slate-900 leading-tight">FARAFERO</h1>
                        <p class="text-[10px] text-slate-500 font-bold tracking-widest uppercase">GIFT SHOP</p>
                    </div>
                </div>
                <!-- Realtime Badge matching user request -->
                <div class="hidden sm:flex items-center space-x-1.5 space-x-reverse bg-emerald-50 border border-emerald-200 px-3 py-1 rounded-full">
                    <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span>
                    <span class="text-[11px] font-bold text-emerald-700">متصل وفتزام่น realtime</span>
                </div>
            </div>

            <!-- Cart Button -->
            <div class="flex items-center space-x-3 space-x-reverse">
                <button onclick="openCart()" class="relative bg-blush-50 hover:bg-blush-100 text-blush-700 p-3 rounded-2xl font-bold transition-all flex items-center space-x-2 space-x-reverse border border-blush-200">
                    <i class="fa-solid fa-bag-shopping text-lg"></i>
                    <span id="cart-badge" class="absolute -top-1.5 -right-1.5 bg-blush-600 text-white text-[10px] w-5 h-5 rounded-full flex items-center justify-center font-bold">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- MOBILE BOTTOM NAVIGATION BAR (Matching User Screenshot Layout) -->
    <div class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 px-2 py-3 flex justify-around shadow-2xl z-50">
        <button onclick="switchTab('store')" id="mob-nav-store" class="text-xs font-bold text-blush-600 flex flex-col items-center">
            <i class="fa-solid fa-store text-lg mb-1"></i> المتجر
        </button>
        <button onclick="switchTab('customizer-tab')" id="mob-nav-customizer" class="text-xs font-bold text-slate-400 flex flex-col items-center">
            <i class="fa-solid fa-wand-magic-sparkles text-lg mb-1"></i> التنسيق
        </button>
        <button onclick="switchTab('pos')" id="mob-nav-pos" class="text-xs font-bold text-slate-400 flex flex-col items-center">
            <i class="fa-solid fa-cash-register text-lg mb-1"></i> الكاشير
        </button>
        <button onclick="switchTab('admin')" id="mob-nav-admin" class="text-xs font-bold text-slate-400 flex flex-col items-center">
            <i class="fa-solid fa-chart-line text-lg mb-1"></i> الإدارة
        </button>
    </div>

    <!-- MAIN APP CONTAINER -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 w-full space-y-6">

        <!-- ==================== TAB 1: STOREFRONT & HERO ==================== -->
        <div id="tab-store" class="space-y-6">
            
            <!-- Realtime Indicator for Mobile -->
            <div class="sm:hidden flex items-center justify-center space-x-1.5 space-x-reverse bg-emerald-50 border border-emerald-200 py-1.5 px-3 rounded-full w-fit mx-auto">
                <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span>
                <span class="text-[11px] font-bold text-emerald-700">متصل وفتزام่น realtime</span>
            </div>

            <!-- HERO BANNER (Matching Screenshot Gradient Box) -->
            <section class="bg-gradient-to-r from-rose-500 via-pink-500 to-blush-600 rounded-3xl p-6 sm:p-10 text-white shadow-xl relative overflow-hidden space-y-4">
                <div class="absolute -left-10 -bottom-10 w-40 h-40 bg-white/10 rounded-full blur-2xl"></div>
                <div class="inline-block bg-white/20 backdrop-blur-md px-3.5 py-1 rounded-full text-[11px] font-bold tracking-wider uppercase">
                    FARAFERO PREMIUM STORE
                </div>
                <h2 class="text-3xl sm:text-4xl font-black leading-tight">
                    هدايا تُعبّر عن أصل اللحظات!
                </h2>
                <p class="text-white/90 text-sm sm:text-base font-medium max-w-xl leading-relaxed">
                    اختر من تشكيلتنا المميزة أو صمم صندوق هديتك الخاص بكل سهولة وبأرقى تفاصيل.
                </p>
                <div class="pt-2">
                    <button onclick="switchTab('customizer-tab')" class="bg-white text-rose-600 hover:bg-slate-100 font-black px-6 py-3.5 rounded-2xl shadow-lg transition-all flex items-center space-x-2 space-x-reverse text-sm">
                        <i class="fa-solid fa-gift text-rose-500"></i>
                        <span>ابدأ بتصميم هديتك الآن</span>
                    </button>
                </div>
            </section>

            <!-- Search Bar & Filters -->
            <div class="space-y-4">
                <div class="relative">
                    <span class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none text-slate-400">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </span>
                    <input type="text" id="store-search" oninput="renderStorefront()" placeholder="ابحث عن هدية..." class="w-full bg-white border border-slate-200 rounded-2xl py-3.5 pr-11 pl-4 text-sm font-semibold shadow-sm focus:outline-none focus:border-blush-500">
                </div>

                <!-- Category Pills (Matching Screenshot Categories) -->
                <div class="flex items-center space-x-2 space-x-reverse overflow-x-auto pb-2 custom-scrollbar">
                    <button onclick="filterCategory('All')" class="cat-btn active bg-rose-600 text-white px-5 py-2.5 rounded-2xl text-xs font-bold whitespace-nowrap shadow-sm transition-all">الكل</button>
                    <button onclick="filterCategory('ألعاب')" class="cat-btn bg-white border border-slate-200 text-slate-600 hover:bg-slate-50 px-5 py-2.5 rounded-2xl text-xs font-bold whitespace-nowrap shadow-sm transition-all">ألعاب</button>
                    <button onclick="filterCategory('صناديق')" class="cat-btn bg-white border border-slate-200 text-slate-600 hover:bg-slate-50 px-5 py-2.5 rounded-2xl text-xs font-bold whitespace-nowrap shadow-sm transition-all">صناديق</button>
                    <button onclick="filterCategory('هدايا')" class="cat-btn bg-white border border-slate-200 text-slate-600 hover:bg-slate-50 px-5 py-2.5 rounded-2xl text-xs font-bold whitespace-nowrap transition-all">هدايا</button>
                    <button onclick="filterCategory('إكسسوارات')" class="cat-btn bg-white border border-slate-200 text-slate-600 hover:bg-slate-50 px-5 py-2.5 rounded-2xl text-xs font-bold whitespace-nowrap transition-all">إكسسوارات</button>
                </div>
            </div>

            <!-- Product Cards Grid (Matching Screenshot Card Layout) -->
            <div id="product-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4">
                <!-- Injected Dynamically -->
            </div>
        </div>


        <!-- ==================== TAB 2: CUSTOMIZER (التنسيق) ==================== -->
        <div id="tab-customizer-tab" class="hidden space-y-6">
            <div class="bg-white rounded-3xl p-6 sm:p-8 shadow-xl border border-blush-100 space-y-6">
                <div class="flex items-center justify-between border-b border-slate-100 pb-4">
                    <h3 class="text-xl font-black text-slate-900 flex items-center space-x-2 space-x-reverse">
                        <i class="fa-solid fa-box-open text-blush-600"></i>
                        <span>استوديو تصميم الهدية المخصصة</span>
                    </h3>
                    <span class="text-
